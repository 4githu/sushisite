name: Verify desktop restoration
on: [push]
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: netaq-vitrine-engine-release-test
          run-id: 45320146126
          github-token: ${{ github.token }}
      - name: Test owner exit and layout restore
        shell: pwsh
        run: ./test/lifecycle.ps1
