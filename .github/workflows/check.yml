name: Verify NETAQ desktop engine
on: [push]
permissions:
  contents: read
jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo build --release -p vitrine-app
      - name: Render all widget sizes with sample data
        shell: pwsh
        run: |
          foreach ($widget in @('today','week','month','tasks','memo')) {
            foreach ($size in @('128x128','180x180','400x320','650x360')) {
              $out = "preview-$widget-$size.png"
              $p = Start-Process -FilePath 'target/release/vitrine.exe' -ArgumentList @('render','test-widget-fixture',$widget,'--size',$size,'--wait','1500','--out',$out) -PassThru -Wait
              if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Render failed $widget $size" }
            }
          }
      - name: Test desktop host startup
        shell: pwsh
        run: ./test/desktop-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: netaq-widgets-engine-0150
          path: |
            target/release/vitrine.exe
            preview-*.png
          if-no-files-found: error
