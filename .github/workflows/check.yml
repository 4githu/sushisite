name: Verify NETAQ desktop engine
on: [push]
permissions:
  contents: read
jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo build -p vitrine-app
      - uses: actions/upload-artifact@v4
        with:
          name: netaq-vitrine-engine-dev
          path: |
            target/debug/vitrine.exe
            Cargo.lock
          if-no-files-found: error
