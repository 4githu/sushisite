name: Verify NETAQ desktop engine
on: [push]
permissions:
  contents: read
jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo build --release -p vitrine-app
      - name: Render widget preview
        shell: pwsh
        run: |
          $preview = Start-Process -FilePath 'target/release/vitrine.exe' -ArgumentList @('render','test-widget','today','--cells','5x5','--out','widget-preview.png') -PassThru -Wait
          if ($preview.ExitCode -ne 0 -or !(Test-Path widget-preview.png)) { throw 'Preview render failed' }
      - name: Test desktop host startup
        shell: pwsh
        run: ./test/desktop-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: netaq-vitrine-engine-release-test
          path: |
            target/release/vitrine.exe
            Cargo.lock
            widget-preview.png
          if-no-files-found: error
