[Rainmeter]
Update=1000
AccurateText=1
DefaultAlwaysOnTop=-2
DefaultDraggable=1
DefaultSavePosition=1
OnCloseAction=[!WriteKeyValue Variables Width "#Width#" "#@#settings.inc"][!WriteKeyValue Variables Height "#Height#" "#@#settings.inc"]

[Metadata]
Name=NETAQ 오늘
Author=NETAQ
Information=NETAQ 일정과 할 일
Version=1.0
License=MIT

[Variables]
@Include=#@#settings.inc

[Background]
Meter=Shape
Shape=Rectangle 0,0,#Width#,(#Height#+30),12 | Fill Color 255,255,255,255 | StrokeWidth 1 | Stroke Color 222,223,226,255
DynamicVariables=1

[Title]
Meter=String
X=10
Y=7
Text=NETAQ
FontFace=Malgun Gothic
FontSize=10
FontWeight=600
FontColor=36,37,41,255
AntiAlias=1

[WebView]
Measure=Plugin
Plugin=NETAQWebView2
URL=https://netaq.chobab.app/personal-project/desktop-widget
X=0
Y=30
W=#Width#
H=#Height#
Clickthrough=0
NewWindow=1
DynamicVariables=1

[WidthMinus]
Meter=String
X=(#Width#-186)
Y=7
Text=가로 −
FontFace=Malgun Gothic
FontSize=9
FontColor=90,90,95,255
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!SetVariable Width "(Clamp(#Width#-40,260,1000))"][!WriteKeyValue Variables Width "#Width#" "#@#settings.inc"][!UpdateMeasure WebView][!UpdateMeter *][!Redraw]

[WidthPlus]
Meter=String
X=(#Width#-145)
Y=7
Text=+
FontFace=Malgun Gothic
FontSize=10
FontColor=90,90,95,255
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!SetVariable Width "(Clamp(#Width#+40,260,1000))"][!WriteKeyValue Variables Width "#Width#" "#@#settings.inc"][!UpdateMeasure WebView][!UpdateMeter *][!Redraw]

[HeightMinus]
Meter=String
X=(#Width#-120)
Y=7
Text=세로 −
FontFace=Malgun Gothic
FontSize=9
FontColor=90,90,95,255
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!SetVariable Height "(Clamp(#Height#-40,200,1000))"][!WriteKeyValue Variables Height "#Height#" "#@#settings.inc"][!UpdateMeasure WebView][!UpdateMeter *][!Redraw]

[HeightPlus]
Meter=String
X=(#Width#-79)
Y=7
Text=+
FontFace=Malgun Gothic
FontSize=10
FontColor=90,90,95,255
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!SetVariable Height "(Clamp(#Height#+40,200,1000))"][!WriteKeyValue Variables Height "#Height#" "#@#settings.inc"][!UpdateMeasure WebView][!UpdateMeter *][!Redraw]

[Close]
Meter=String
X=(#Width#-27)
Y=5
Text=×
FontFace=Malgun Gothic
FontSize=13
FontColor=90,90,95,255
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!DeactivateConfig]
